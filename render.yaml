services:
  - type: web
    name: booking-backend-monolith
    runtime: python
    plan: starter
    branch: main
    rootDir: backend/core-monolith
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: booking-monolith-db
    plan: starter
    databaseName: core_db
    user: booking_user
